services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-paperclip}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-paperclip}"
      POSTGRES_DB: "${POSTGRES_DB:-paperclip}"
      # Controls the port Postgres itself listens on inside the container.
      PGPORT: "${POSTGRES_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperclip} -d ${POSTGRES_DB:-paperclip} -p ${POSTGRES_PORT:-5432}"]
      interval: 2s
      timeout: 5s
      retries: 30
      # Grace period before failed checks count toward `retries`, so a slow
      # first-boot initdb on constrained hosts does not trip "unhealthy".
      start_period: 30s
    # Not published to the host: paperclip reaches it over the compose
    # network at postgres:5432, and publishing a DB port is an unnecessary
    # exposure on shared/multi-tenant hosts (Dokploy, Coolify, etc.).
    volumes:
      - pgdata:/var/lib/postgresql/data

  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # No `init: true` here on purpose. The image makes tini PID 1 itself
    # (Dockerfile ENTRYPOINT), which covers every launch path -- compose, plain
    # `docker run`, the quadlet units and the ECS task definition -- instead of
    # one lever per orchestrator. Setting it here too would nest docker-init
    # around tini and make tini warn that it is not PID 1 on every boot.
    # pids_limit is the backstop: if something ever does leak processes again,
    # this container hits its own ceiling and dies visibly rather than starving
    # the whole host of pids.
    pids_limit: 2048
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-paperclip}:${POSTGRES_PASSWORD:-paperclip}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-paperclip}"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "${PAPERCLIP_DEPLOYMENT_EXPOSURE:-private}"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      # Extra hostnames the instance accepts beyond the public URL host
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"
      # Granular auth base URL overrides; leave unset to derive from PAPERCLIP_PUBLIC_URL
      PAPERCLIP_AUTH_BASE_URL_MODE: "${PAPERCLIP_AUTH_BASE_URL_MODE:-}"
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: "${PAPERCLIP_AUTH_PUBLIC_BASE_URL:-}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
